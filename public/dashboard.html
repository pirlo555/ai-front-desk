<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Front Desk Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#EEF4F2; --surface:#FFFFFF; --surface-2:#F6FAF9; --line:#D3E2DE;
  --ink:#10231F; --ink-2:#4A5E59; --ink-3:#7A8D88;
  --accent:#0F6B5C; --accent-ink:#FFFFFF; --accent-soft:#D6EEE8;
  --urgent:#B4232F; --urgent-soft:#F8E1E3; --value:#8A5A00; --value-soft:#F6EACB;
  --routine:#3D5A80; --routine-soft:#E2E9F3;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --ground:#0B1513; --surface:#12201D; --surface-2:#172825; --line:#243a35;
    --ink:#E3EEEB; --ink-2:#A8BCB7; --ink-3:#768B86;
    --accent:#5BC5B0; --accent-ink:#06201A; --accent-soft:#173D36;
    --urgent:#F08A93; --urgent-soft:#3A1C20; --value:#E6BC62; --value-soft:#352B14;
    --routine:#9DB8DD; --routine-soft:#1C2838;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 var(--body);padding:0 20px}
.wrap{max-width:1100px;margin:0 auto;padding-block:20px 48px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
h1,h2{font-family:var(--display);letter-spacing:-.01em;margin:0}

.login{max-width:380px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:14px}
.login h1{font-size:26px}
.login p{margin:0;color:var(--ink-2)}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2)}
input,select{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:15px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.error{color:var(--urgent);font-size:14px;margin:0}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:24px}
.top small{display:block;color:var(--ink-3);font-size:13px;font-family:var(--body)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;margin-block:20px 16px}
.stat{padding:12px 16px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat dt{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.stat dd{margin:2px 0 0;font:700 26px var(--display);font-variant-numeric:tabular-nums}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.leads{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px}
.lead.urgent{border-left:4px solid var(--urgent)}
.name{font-weight:600;font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meta{font:12px var(--mono);color:var(--ink-2)}
.facts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13.5px;color:var(--ink-2)}
.facts b{color:var(--ink);font-weight:600}
.summary{grid-column:1/-1;font-size:14px;border-top:1px dashed var(--line);padding-top:8px}
.actions{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}
.actions select{padding:6px 8px;font-size:13px}
.actions .btn{padding:6px 12px;font-size:13px}
.chip{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.chip.urgent{background:var(--urgent-soft);color:var(--urgent)}
.chip.value{background:var(--value-soft);color:var(--value)}
.chip.routine{background:var(--routine-soft);color:var(--routine)}
.chip.lang{background:var(--accent-soft);color:var(--accent)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--ink-2)}

dialog{border:1px solid var(--line);border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(520px,calc(100vw - 32px));max-height:80vh}
dialog::backdrop{background:rgba(6,20,17,.45)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg-head h2{font-size:18px}
.thread{padding:14px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;max-height:calc(80vh - 64px);background:var(--surface-2)}
.msg{max-width:85%;padding:8px 12px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.msg.user{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.msg.assistant{align-self:flex-end;background:var(--accent-soft)}
.msg time{display:block;font:11px var(--mono);color:var(--ink-3);margin-top:2px}
@media (max-width:760px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(2){border-right:0}
  .stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .lead{grid-template-columns:1fr}
  .actions{justify-content:flex-start}
}
</style>
</head>
<body>
<div class="wrap">
  <form class="login" id="login" hidden>
    <h1 data-t="signInTitle">Front desk sign in</h1>
    <p data-t="signInSub">See new leads from your website chat and missed-call texts.</p>
    <label><span data-t="businessId">Business ID</span> <input id="login-business" autocomplete="username" required value="brisa"></label>
    <label><span data-t="password">Password</span> <input id="login-password" type="password" autocomplete="current-password" required></label>
    <p class="error" id="login-error" hidden></p>
    <button class="btn" type="submit" data-t="signIn">Sign in</button>
  </form>

  <section id="app" hidden>
    <div class="top">
      <h1 id="business-name">Leads<small data-t="updates">Updates every 15 seconds</small></h1>
      <button class="btn ghost" id="logout" data-t="signOut">Sign out</button>
    </div>
    <dl class="stats" id="stats"></dl>
    <div class="filters" role="group" id="filters">
      <button data-filter="open" aria-pressed="true" data-t="fNeedsAction">Needs action</button>
      <button data-filter="urgent" aria-pressed="false" data-t="fUrgent">Urgent</button>
      <button data-filter="requested" aria-pressed="false" data-t="fRequests">Appointment requests</button>
      <button data-filter="all" aria-pressed="false" data-t="fAll">All</button>
    </div>
    <ul class="leads" id="leads"></ul>
  </section>
</div>

<dialog id="convo">
  <div class="dlg-head"><h2 id="convo-title">Conversation</h2><button class="btn ghost" id="convo-close" data-t="close">Close</button></div>
  <div class="thread" id="convo-thread"></div>
</dialog>

<script>
// Every word the staff reads, in both languages. Which one is used comes from
// the business file, so a Hialeah plumber sees Spanish and a Brickell clinic
// sees English from the same install. The public is answered in their own
// language regardless of this setting.
const I18N = {
  en: {
    signInTitle:"Front desk sign in", signInSub:"See new leads from your website chat and missed-call texts.",
    businessId:"Business ID", password:"Password", signIn:"Sign in", signOut:"Sign out",
    signInFailed:"Sign in failed.", requestFailed:"Request failed.", updates:"Updates every 15 seconds",
    fNeedsAction:"Needs action", fUrgent:"Urgent", fRequests:"Appointment requests", fAll:"All",
    close:"Close", filterLeads:"Filter leads",
    statNewToday:"New today", statNeedsAction:"Needs action", statUrgent:"Urgent", statConfirmed:"Confirmed",
    emptyFiltered:"Nothing here. Try another filter.",
    emptyNone:(who)=>`No leads yet. They appear here as soon as the assistant learns a ${who}'s name and what they need.`,
    chipUrgent:"Urgent", chipSoon:"Soon", chipValue:"High value", chipRoutine:"Routine",
    noPhone:"no phone yet", viaSms:"Missed call → text", viaWeb:"Website chat",
    needs:"Needs", statusLabel:"Status", prefers:"Prefers", otherJob:"Other",
    viewChat:"View chat", assistant:"Assistant", statusFor:(n)=>`Status for ${n}`,
    status:{requested:"Appointment requested",callback:"Wants a call",followup:"Still deciding"},
    desk:{new:"New",contacted:"Contacted",confirmed:"Appointment confirmed",closed:"Closed"},
  },
  es: {
    signInTitle:"Acceso de recepción", signInSub:"Vea los contactos nuevos del chat de su web y de las llamadas perdidas.",
    businessId:"Identificador del negocio", password:"Contraseña", signIn:"Entrar", signOut:"Salir",
    signInFailed:"No se pudo entrar.", requestFailed:"No se pudo completar.", updates:"Se actualiza cada 15 segundos",
    fNeedsAction:"Necesita atención", fUrgent:"Urgente", fRequests:"Citas pedidas", fAll:"Todos",
    close:"Cerrar", filterLeads:"Filtrar contactos",
    statNewToday:"Nuevos hoy", statNeedsAction:"Por atender", statUrgent:"Urgentes", statConfirmed:"Confirmados",
    emptyFiltered:"Aquí no hay nada. Pruebe otro filtro.",
    emptyNone:(who)=>`Todavía no hay contactos. Aparecen aquí en cuanto el asistente sabe el nombre de un ${who} y lo que necesita.`,
    chipUrgent:"Urgente", chipSoon:"Pronto", chipValue:"Alto valor", chipRoutine:"Normal",
    noPhone:"sin teléfono aún", viaSms:"Llamada perdida → mensaje", viaWeb:"Chat de la web",
    needs:"Necesita", statusLabel:"Estado", prefers:"Prefiere", otherJob:"Otro",
    viewChat:"Ver conversación", assistant:"Asistente", statusFor:(n)=>`Estado de ${n}`,
    status:{requested:"Cita pedida",callback:"Quiere que le llamen",followup:"Todavía decidiendo"},
    desk:{new:"Nuevo",contacted:"Contactado",confirmed:"Cita confirmada",closed:"Cerrado"},
  },
};

// Before sign-in we don't know the business yet, so follow the browser.
let T = I18N[(navigator.language || "en").slice(0,2) === "es" ? "es" : "en"];

function applyStaticText() {
  document.querySelectorAll("[data-t]").forEach(el => { const v = T[el.dataset.t]; if (typeof v === "string") el.textContent = v; });
  const f = $("filters"); if (f) f.setAttribute("aria-label", T.filterLeads);
  document.documentElement.lang = T === I18N.es ? "es" : "en";
}

// Labels depend on the industry, so they come from the server after sign-in.
let biz = {jobTypes:{}, highValue:[], contact:{one:"customer",plural:"customers"}, qualifierLabel:"", qualifierEmpty:""};
let highValue = new Set();

let leads = [], filter = "open", timer = null;
const $ = (id) => document.getElementById(id);

async function api(path, opts = {}) {
  const r = await fetch(`/api/desk${path}`, { headers: { "Content-Type": "application/json" }, ...opts });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) { showLogin(); throw new Error("signed out"); }
  if (!r.ok) throw new Error(data.error || T.requestFailed);
  return data;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function when(iso) {
  const d = new Date(iso);
  const sameDay = d.toDateString() === new Date().toDateString();
  return sameDay ? d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : d.toLocaleDateString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}

function showLogin() {
  clearInterval(timer);
  $("app").hidden = true; $("login").hidden = false;
}

async function showApp(business) {
  $("login").hidden = true; $("app").hidden = false;
  biz = business;
  T = I18N[business.language] || I18N.en;
  applyStaticText();
  highValue = new Set(business.highValue || []);
  $("business-name").firstChild.textContent = business.name;
  await refresh();
  clearInterval(timer);
  timer = setInterval(() => refresh().catch(() => {}), 15000);
}

async function refresh() {
  leads = (await api("/leads")).leads;
  render();
}

function render() {
  const today = new Date().toDateString();
  const stats = [
    [T.statNewToday, leads.filter(l => new Date(l.created_at).toDateString() === today).length],
    [T.statNeedsAction, leads.filter(l => l.desk_status === "new").length],
    [T.statUrgent, leads.filter(l => l.urgency === "emergency" && l.desk_status !== "closed").length],
    [T.statConfirmed, leads.filter(l => l.desk_status === "confirmed").length],
  ];
  const s = $("stats"); s.textContent = "";
  stats.forEach(([k, v]) => { const d = el("div", "stat"); d.append(el("dt", null, k), el("dd", null, v)); s.append(d); });

  const shown = leads.filter(l =>
    filter === "all" ? true :
    filter === "urgent" ? l.urgency === "emergency" && l.desk_status !== "closed" :
    filter === "requested" ? l.status === "requested" && l.desk_status !== "confirmed" && l.desk_status !== "closed" :
    l.desk_status === "new" || l.desk_status === "contacted");

  const ul = $("leads"); ul.textContent = "";
  if (!shown.length) { ul.append(el("li", "empty", leads.length ? T.emptyFiltered : T.emptyNone(biz.contact.one))); return; }

  shown.forEach(l => {
    const li = el("li", "lead" + (l.urgency === "emergency" ? " urgent" : ""));
    const left = el("div");
    const name = el("div", "name", l.name);
    const pr = l.urgency === "emergency" ? ["urgent",T.chipUrgent] : l.urgency === "soon" ? ["urgent",T.chipSoon] : highValue.has(l.job_type) ? ["value",T.chipValue] : ["routine",T.chipRoutine];
    name.append(el("span", "chip " + pr[0], pr[1]), el("span", "chip lang", l.language.toUpperCase()));
    const meta = el("div", "meta", `${l.phone || T.noPhone} · ${l.channel === "sms" ? T.viaSms : T.viaWeb} · ${when(l.updated_at)}`);
    left.append(name, meta);

    const actions = el("div", "actions");
    const sel = el("select"); sel.setAttribute("aria-label", T.statusFor(l.name));
    Object.entries(T.desk).forEach(([v, t]) => { const o = el("option", null, t); o.value = v; o.selected = v === l.desk_status; sel.append(o); });
    sel.addEventListener("change", async () => {
      try { await api(`/leads/${l.id}`, { method: "PATCH", body: JSON.stringify({ desk_status: sel.value }) }); l.desk_status = sel.value; render(); }
      catch (e) { alert(e.message); }
    });
    const view = el("button", "btn ghost", T.viewChat);
    view.addEventListener("click", () => openConversation(l));
    actions.append(sel, view);

    const facts = el("div", "facts");
    const fact = (k, v) => { const sp = el("span"); sp.append(el("b", null, k + ": "), document.createTextNode(v)); return sp; };
    facts.append(fact(T.needs, biz.jobTypes[l.job_type] || T.otherJob));
    if (biz.qualifierLabel) facts.append(fact(biz.qualifierLabel, l.qualifier || biz.qualifierEmpty));
    facts.append(fact(T.statusLabel, T.status[l.status] || l.status));
    if (l.preferred_time) facts.append(fact(T.prefers, l.preferred_time));

    li.append(left, actions, facts);
    if (l.summary) li.append(el("div", "summary", l.summary));
    ul.append(li);
  });
}

async function openConversation(lead) {
  const data = await api(`/conversations/${lead.conversation_id}`);
  $("convo-title").textContent = `${lead.name} · ${data.channel === "sms" ? data.contact : "Website chat"}`;
  const t = $("convo-thread"); t.textContent = "";
  const who = biz.contact.one.charAt(0).toUpperCase() + biz.contact.one.slice(1);
  data.messages.forEach(m => { const b = el("div", "msg " + m.role, m.content); b.append(el("time", null, (m.role === "user" ? who + " · " : T.assistant + " · ") + when(m.created_at))); t.append(b); });
  $("convo").showModal();
  t.scrollTop = t.scrollHeight;
}

$("convo-close").addEventListener("click", () => $("convo").close());
document.querySelectorAll("[data-filter]").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.filter;
  document.querySelectorAll("[data-filter]").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
}));

$("login").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("login-error").hidden = true;
  try {
    const r = await fetch("/api/desk/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ business: $("login-business").value.trim(), password: $("login-password").value }) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || T.signInFailed);
    $("login-password").value = "";
    showApp(data.business);
  } catch (err) { $("login-error").textContent = err.message; $("login-error").hidden = false; }
});

$("logout").addEventListener("click", async () => { await fetch("/api/desk/logout", { method: "POST" }); showLogin(); });

applyStaticText();
fetch("/api/desk/me").then(r => r.ok ? r.json() : null).then(d => d ? showApp(d.business) : showLogin()).catch(showLogin);
</script>
</body>
</html>
