<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business website demo</title>
<style>
  body { margin: 0; font-family: Georgia, "Times New Roman", serif; color: #1d2b28; background: #fbfaf7; }
  .bar { background: #fff3cd; color: #5c4700; font: 13px system-ui, sans-serif; padding: 8px 16px; text-align: center; }
  main { max-width: 760px; margin: 0 auto; padding: 56px 20px; }
  h1 { font-size: clamp(32px, 5vw, 52px); line-height: 1.05; margin: 0 0 16px; }
  p { font-size: 18px; line-height: 1.6; max-width: 58ch; }
  .fake { margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .fake div { background: #eee9df; border-radius: 10px; height: 120px; }
</style>
</head>
<body>
  <div class="bar">Test page: this stands in for the business's own website. The chat bubble in the corner is the real assistant.</div>
  <main>
    <h1 id="title">Business website</h1>
    <p>Open the chat in the bottom-right corner and write as a customer would, in English or Spanish. New leads show up in the dashboard.</p>
    <div class="fake" aria-hidden="true"><div></div><div></div><div></div></div>
  </main>
  <script>
    const id = location.pathname.split("/").pop();
    const s = document.createElement("script");
    s.src = "/widget.js"; s.dataset.business = id; s.defer = true;
    document.body.appendChild(s);
    fetch(`/api/businesses/${id}/public`).then(r => r.json()).then(c => { document.getElementById("title").textContent = c.name; document.title = c.name; });
  </script>
</body>
</html>
