<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}}</title>
<style>
  :root{--ink:#1d2b28;--ink-2:#55635f;--line:#ddd7cb;--accent:#8a6a2f}
  *{box-sizing:border-box}
  body { margin: 0; font-family: Georgia, "Times New Roman", serif; color: var(--ink); background: #fbfaf7; }
  .bar { background: #fff3cd; color: #5c4700; font: 13px/1.45 system-ui, sans-serif; padding: 9px 16px; text-align: center; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 20px 64px; }
  h1 { font-size: clamp(30px, 5vw, 50px); line-height: 1.05; margin: 0 0 14px; }
  p { font-size: 18px; line-height: 1.6; max-width: 58ch; }

  /* The call-to-action block is the evidence an A2P reviewer asks for: the
     number people dial and the disclosure that calling it may bring a text
     back. It is rendered on the server, because the automated checks that
     read this page do not run JavaScript. */
  .cta { margin: 32px 0 8px; padding: 22px 24px; background: #fff;
         border: 1px solid var(--line); border-top: 3px solid var(--accent); }
  .cta .label { font: 600 11px/1 system-ui, sans-serif; letter-spacing: .14em;
                text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 10px; }
  .cta .tel { font-size: clamp(26px, 4vw, 34px); font-weight: 700; letter-spacing: -.01em;
              color: var(--ink); text-decoration: none; display: inline-block; }
  .cta .sms { margin: 14px 0 0; font: 14px/1.6 system-ui, sans-serif; color: var(--ink-2); max-width: none; }
  .cta a.pol { color: var(--accent); }

  .fake { margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .fake div { background: #eee9df; border-radius: 10px; height: 120px; }
</style>
</head>
<body>
  <div class="bar">{{BAR}}</div>
  <main>
    <h1>{{NAME}}</h1>
    <p>{{LEDE}}</p>

    <div class="cta">
      <span class="label">{{CTA_LABEL}}</span>
      <a class="tel" href="tel:{{TEL_HREF}}">{{PHONE}}</a>
      <p class="sms">{{SMS}}
        <a class="pol" href="/privacy">{{PRIVACY_LABEL}}</a> ·
        <a class="pol" href="/terms">{{TERMS_LABEL}}</a>
      </p>
    </div>

    <div class="fake" aria-hidden="true"><div></div><div></div><div></div></div>
  </main>
  <script src="/widget.js" data-business="{{ID}}" defer></script>
</body>
</html>
